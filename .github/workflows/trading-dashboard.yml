name: Trading dashboard

# Runs in GitHub's cloud, not on the laptop. That is the whole point. The Task
# Scheduler job this replaces carried DisallowStartIfOnBatteries=True,
# WakeToRun=False and RunOnlyIfNetworkAvailable=True, which are three
# independent ways to skip silently on a laptop. So it produced a dashboard that
# looked current and was not, on any day the machine was unplugged or asleep at
# 6:45am, 1:00pm or 5:30pm. Silent staleness on a decision aid is worse than no
# dashboard.
#
# PRIVACY. The rendered dashboard goes to CLOUDFLARE PAGES BEHIND CLOUDFLARE
# ACCESS, so it requires a real login (email one-time code or Google) and is not
# readable by the public. It is deliberately NOT GitHub Pages: access control
# there needs GitHub Enterprise Cloud plus an organization, and site visibility
# is a separate setting from repository visibility, so a private repo would
# still publish a public site. There is no login option there on a personal
# plan.
# scripts/provision_access.py creates the Access policy BEFORE the deploy runs,
# so the site is never served without a login even momentarily, and the deploy
# is skipped if that fails.
# The SOURCE repo stays public, which is fine: every input is already committed
# here, DRY_RUN is True at main.py line 19, and nothing has ever placed an
# order, so the page renders a model portfolio rather than a position book.
# THE DAY IT RENDERS REAL HOLDINGS, REAL SIZING OR REAL ACCOUNT VALUES, the repo
# itself should go private too. Do not inherit that decision without re-reading it.
# Deploy stays OFF until repository variable PUBLISH_PAGES is 'true' AND the
# CLOUDFLARE_API_TOKEN secret exists. Until then the build still runs and
# uploads a private workflow artifact, so nothing is blocked.
#
# All times UTC. GitHub cron does not observe daylight saving, so these slots
# drift an hour in winter. For a thrice-daily dashboard that is harmless, and
# the page stamps its own build time and market as-of date, so the drift is
# visible rather than hidden. Do not build machinery for it.
#
# TRAP WORTH KNOWING: GitHub disables scheduled workflows after 60 days with no
# repository activity, quietly. This workflow deliberately does not commit
# anything back, so the repo's own commit activity is the only thing keeping the
# schedule alive. That is the exact failure mode this migration exists to
# escape, hiding inside the tool being migrated to.

# SCHEDULED RUNS ARE NOT PUNCTUAL, and these are measured, not quoted. Across
# every scheduled run through 2026-09-10 the queue delay was 1.9 to 3.5 hours,
# median 2.3, against the 5 to 20 minutes usually cited. Treat every time below
# as "no earlier than", never "at".
#
# That measurement already broke one slot. The morning cron was 11:45Z, nominally
# 6:45am Central and meant to be pre-open. It actually ran at 15:16Z and 15:17Z,
# against a 14:30Z open, so it NEVER ONCE ran before the open. It is now 09:30Z,
# chosen so that even the worst delay observed (3.5h) still lands about an hour
# before the open rather than after it. If the delay distribution worsens, move
# it earlier again; do not assume the nominal time.
#
# The page stamps its own build time and market as-of date, so a late run is
# visible rather than silently passed off as current. That property is what makes
# the remaining drift tolerable, and it is why no machinery is built for it.
on:
  schedule:
    - cron: '30 9 * * 1-5'    # early enough that a 3.5h delay still beats the open
    - cron: '0 18 * * 1-5'    # nominally 1:00pm Central
    - cron: '30 22 * * 1-5'   # nominally 5:30pm Central, after the close
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs race over the same Pages deployment.
concurrency:
  group: trading-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      asof: ${{ steps.build.outputs.asof }}
      regime: ${{ steps.build.outputs.regime }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Deliberately NOT requirements.txt. That file pulls schwab-py and the
      # Google auth stack into a job that must never trade and holds no
      # credentials. These four are the entire transitive dependency set of the
      # build path, verified by running build_dashboard.py in a clean virtual
      # environment containing only them. vaderSentiment is required because
      # live_picks imports news_sentiment at module load, even though the
      # sentiment tilt itself is switched off (it sits in the rejected tier).
      - name: Install the build path only
        run: pip install numpy pandas yfinance vaderSentiment

      # Under `bash -e` a non-zero exit aborts the step before anything can be
      # inspected, so the exit code is captured inline and acted on afterwards.
      - name: Build the dashboard
        id: build
        run: |
          set +e
          python build_dashboard.py --out site 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::build_dashboard.py exited $code"
            tail -40 build.log
            exit "$code"
          fi
          if [ ! -s site/TRADING-DASHBOARD.html ]; then
            echo "::error::no dashboard was written"
            exit 1
          fi
          # Pages serves index.html; the script writes TRADING-DASHBOARD.html.
          cp site/TRADING-DASHBOARD.html site/index.html
          asof=$(grep -o 'Market data as of [0-9-]*' site/TRADING-DASHBOARD.md | head -1 | sed 's/Market data as of //')
          regime=$(grep -o 'RISK ON\|RISK OFF' build.log | head -1)
          echo "asof=${asof:-unknown}" >> "$GITHUB_OUTPUT"
          echo "regime=${regime:-unknown}" >> "$GITHUB_OUTPUT"
          echo "built for $asof, regime $regime"

      # The safety lock is the one thing worth failing the build over. If
      # DRY_RUN ever stops being True, the dashboard's central claim about
      # itself is false and it should not be published saying otherwise.
      - name: Assert the safety lock
        run: |
          if ! grep -qE '^DRY_RUN\s*=\s*True' main.py; then
            echo "::error::DRY_RUN is not True in main.py. Refusing to publish a"
            echo "::error::dashboard that claims to be read only."
            exit 1
          fi
          echo "DRY_RUN = True confirmed"

      # Always available, needs no Pages and no approval. This is the fallback
      # if Pages is never enabled, though an artifact is not glanceable on a
      # phone, which loses most of the point.
      - name: Upload artifact copy
        uses: actions/upload-artifact@v4
        with:
          name: trading-dashboard
          path: site/
          retention-days: 14

  # Cloudflare Pages, NOT GitHub Pages. GitHub Pages cannot be login-gated on a
  # personal account: access control there needs Enterprise Cloud plus an
  # organization, and repo visibility is a separate setting from site
  # visibility, so making the repo private would NOT make the site private.
  # Cloudflare Access puts a real login in front (email one-time code or Google)
  # on the Zero Trust free tier. Erik already runs this exact pattern on the
  # escrow portal, so it is proven on his account rather than theoretical.
  #
  # Skips cleanly until CLOUDFLARE_API_TOKEN exists, so a missing credential is
  # a skip and not a red run.
  deploy:
    needs: build
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.url.outputs.page_url }}
      # Whether anything was ACTUALLY published this run. A job result of
      # 'success' does not mean that: the job succeeds when it correctly skips
      # on a missing credential. Without this, the phone push claims the
      # dashboard was updated on a run that published nothing, which is the
      # silent-staleness failure this whole migration exists to prevent, wearing
      # a different costume.
      published: ${{ steps.url.outputs.published }}
    steps:
      - name: Check for the Cloudflare credential
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. Skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # ORDER MATTERS. A Pages project is live the instant it first deploys, so
      # the login has to exist BEFORE any content is served. If this step fails
      # the deploy below does not run, which is the safe direction to fail in.
      - name: Put the login in front first
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_HOSTNAME: trading-dashboard.pages.dev
          ACCESS_ALLOWED_EMAILS: ${{ vars.ACCESS_ALLOWED_EMAILS || 'erik.thordal.christensen@gmail.com' }}
        run: python scripts/provision_access.py

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: trading-dashboard
          path: site

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=trading-dashboard --branch=main

      # The per-deployment URL changes every run; the project alias does not, so
      # that is what belongs in a phone notification.
      # Only reached when the deploy above actually succeeded, so this is the one
      # place entitled to say something was published.
      - name: Resolve the stable URL
        id: url
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "page_url=https://trading-dashboard.pages.dev" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # TRADING_NOTIFY is a repository variable, so the volume changes without
      # editing this file. 'failures' is the quiet default; 'always' also pings
      # on success. Erik asked for done-pings, so it is set to 'always' for now.
      #
      # A failed notification must never fail the run: the dashboard mattering
      # more than the alert about it is the same rule the fantasy bot follows.
      # Hence the trailing || true.
      - name: Push to phone
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC_TRADING }}
          MODE: ${{ vars.TRADING_NOTIFY || 'failures' }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          PUBLISHED: ${{ needs.deploy.outputs.published }}
          ASOF: ${{ needs.build.outputs.asof }}
          REGIME: ${{ needs.build.outputs.regime }}
          # Only the deploy job's own output is trusted. A hand-set
          # DASHBOARD_URL variable is deliberately NOT used as a fallback: one
          # was previously left pointing at a site that had been taken down, so
          # the push offered an "Open dashboard" button that returned 404. A
          # link is only worth sending when this run actually published it.
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOPIC" ]; then
            echo "NTFY_TOPIC_TRADING is not set, so there is nobody to notify. Skipping."
            exit 0
          fi

          # 'skipped' is the NORMAL deploy result while Pages is off, so it must
          # count as fine. Treating it as failure would fire an urgent alert on
          # every healthy run, which is the fastest way to teach someone to
          # ignore the alerts entirely.
          ok=true
          [ "$BUILD" = "success" ] || ok=false
          case "$DEPLOY" in success|skipped|"") ;; *) ok=false ;; esac

          if [ "$ok" = "true" ] && [ "$MODE" != "always" ]; then
            echo "Healthy run and TRADING_NOTIFY is '$MODE', so staying quiet."
            exit 0
          fi

          if [ "$ok" = "true" ] && [ "$PUBLISHED" = "true" ]; then
            title="Trading dashboard updated"
            prio="default"
            tags="chart_with_upwards_trend"
            body="Market data as of ${ASOF}. Strategy C regime gate: ${REGIME}. Model portfolio only, nothing trades."
          elif [ "$ok" = "true" ]; then
            # Built fine, published nothing. Saying "updated" here would be a
            # lie about the only thing the reader cares about.
            title="Trading dashboard built, NOT published"
            prio="default"
            tags="package"
            body="Fresh build for ${ASOF} (regime ${REGIME}), but nothing was published: hosting is not configured yet, so there is no live page to open. The build is attached to the run as an artifact."
          else
            title="Trading dashboard FAILED"
            prio="urgent"
            tags="rotating_light"
            # Stale rather than broken is the distinction that matters, and it is
            # the reason this job was moved off the laptop in the first place.
            body="build=${BUILD} deploy=${DEPLOY}. The last good dashboard is still there, so the page is STALE rather than broken. Do not read it as current."
          fi

          # Never offer an "Open dashboard" button unless THIS run published one.
          link="$RUN_URL"
          label="Open run log"
          if [ "$ok" = "true" ] && [ "$PUBLISHED" = "true" ] && [ -n "$PAGES_URL" ]; then
            link="$PAGES_URL"
            label="Open dashboard"
          fi
          curl -sS --max-time 20 \
            -H "Title: ${title}" \
            -H "Priority: ${prio}" \
            -H "Tags: ${tags}" \
            -H "Actions: view, ${label}, ${link}" \
            -d "${body}" \
            "https://ntfy.sh/${TOPIC}" || true
          echo "notification attempted"

      # Dead-man's switch, and specifically the answer to the 60-day trap in
      # the header comment. Every alert above is sent BY this workflow, so none
      # of them can fire on the day the workflow stops running at all. A
      # heartbeat inverts that: healthchecks.io expects a ping on a schedule and
      # alerts when the pings STOP, which is the only way to learn the schedule
      # was silently disabled.
      #
      # Configure the check as Simple with a period of 26 hours and a 1 hour
      # grace. The dashboard runs three times every weekday, so a 26 hour window
      # tolerates a weekend gap of one day but still catches a real stoppage
      # inside two. A ping failure is swallowed: telemetry must never fail the
      # dashboard it is watching.
      - name: Heartbeat
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL_TRADING }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL_TRADING is not set, so no heartbeat. Skipping."
            exit 0
          fi
          ok=true
          [ "$BUILD" = "success" ] || ok=false
          case "$DEPLOY" in success|skipped|"") ;; *) ok=false ;; esac
          if [ "$ok" = "true" ]; then
            curl -fsS --max-time 15 -d "build=$BUILD deploy=$DEPLOY" \
              "$HEALTHCHECK_URL" > /dev/null || true
            echo "heartbeat: success"
          else
            curl -fsS --max-time 15 -d "build=$BUILD deploy=$DEPLOY" \
              "$HEALTHCHECK_URL/fail" > /dev/null || true
            echo "heartbeat: fail signalled"
          fi
